<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom - account</title>
    <link rel="icon" href="{{ url_for('static', filename='.module/favicon.ico') }}" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='.module/cursor/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>

    <style>
        body {
            background-color: #F2E9E4;
            color: #22223B;
            font-family: 'Roboto Mono', monospace;
        }
        input::placeholder {
            color: #22223B;
            opacity: 0.4;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #22223B; }

        .custom-tag {
            border: 1.5px solid #4A4E69;
            color: #4A4E69;
        }
        .custom-tag:hover {
            background-color: #4A4E69;
            color: #F2E9E4;
        }
        .section-divider {
            border-top: 1px dashed rgba(34, 34, 59, 0.2);
        }
    </style>
</head>
<body class="min-h-screen py-12 px-6">
    <div class="cursor" hidden>
        <div class="cursor__ball cursor__ball--big">
            <svg height="30" width="30"><circle cx="15" cy="15" r="12" stroke-width="0"></circle></svg>
        </div>
        <div class="cursor__ball cursor__ball--small">
            <svg height="10" width="10"><circle cx="5" cy="5" r="4" stroke-width="0"></circle></svg>
        </div>
    </div>

    <div class="max-w-2xl mx-auto space-y-12">

        <!-- Header -->
        <header>
            <div class="flex justify-between items-end border-b-2 border-[#22223B] pb-4">
                <a href="/dashboard">
                    <button class="text-sm font-bold uppercase hover:line-through transition-all focus:outline-none">[Back]</button>
                </a>
                <h1 class="text-2xl font-bold uppercase tracking-tighter">Account</h1>
                <button id="saveBtn" class="text-sm font-bold uppercase hover:line-through transition-all focus:outline-none">
                    [Save]
                </button>
            </div>
        </header>

        <!-- Form Sections -->
        <main class="space-y-10">

            <!-- Profile Inputs -->
            <section class="space-y-6">
                <div>
                    <label class="text-[10px] uppercase font-bold mb-1 block opacity-60">Name</label>
                    <input type="text" id="displayName" value=""
                        class="w-full bg-transparent border-b border-[#22223B]/20 py-2 focus:border-[#22223B] outline-none transition-colors" />
                </div>
                <div class="grid grid-cols-2 gap-8">
                    <div>
                        <label class="text-[10px] uppercase font-bold mb-1 block opacity-60">Level</label>
                        <input type="text" id="cefrLevel" value=""
                            class="w-full bg-transparent border-b border-[#22223B]/20 py-2 focus:border-[#22223B] outline-none transition-colors" />
                    </div>
                    <div>
                        <label class="text-[10px] uppercase font-bold mb-1 block opacity-60">Interests</label>
                        <input type="text" id="interests" value=""
                            class="w-full bg-transparent border-b border-[#22223B]/20 py-2 focus:border-[#22223B] outline-none transition-colors" />
                    </div>
                </div>
            </section>

            <!-- Known Words -->
            <section class="section-divider pt-8">
                <label class="text-[10px] uppercase font-bold mb-3 block opacity-60">Known Words</label>
                <div id="knownWordsContainer" class="flex flex-wrap gap-2"></div>
            </section>

            <!-- Custom Words -->
            <section class="section-divider pt-8">
                <label class="text-[10px] uppercase font-bold mb-1 block opacity-60">Custom Words</label>
                <p class="text-[10px] opacity-40 mb-3">Your personal vocabulary list. Separate multiple words with commas.</p>
                <form id="customWordForm" class="mb-4">
                    <input type="text" id="newCustomWordInput"
                        placeholder="+ Add word or hello,hi,welcome"
                        class="w-full bg-transparent border-b border-[#22223B]/20 py-1 text-xs focus:border-[#22223B] outline-none transition-colors" />
                </form>
                <div id="customWordsContainer" class="flex flex-wrap gap-2"></div>
                <p id="customWordsEmpty" class="text-[10px] opacity-30 italic hidden">No custom words yet.</p>
            </section>

            <!-- Excluded Words -->
            <section class="section-divider pt-8">
                <label class="text-[10px] uppercase font-bold mb-1 block opacity-60">Excluded Words</label>
                <p class="text-[10px] opacity-40 mb-3">Words to skip during sessions. Separate multiple words with commas.</p>
                <form id="excludeForm" class="mb-4">
                    <input type="text" id="newExcludedWordInput"
                        placeholder="+ Add word or hello,hi,welcome"
                        class="w-full bg-transparent border-b border-[#22223B]/20 py-1 text-xs focus:border-[#22223B] outline-none transition-colors" />
                </form>
                <div id="excludedWordsContainer" class="flex flex-wrap gap-2"></div>
                <p id="excludedWordsEmpty" class="text-[10px] opacity-30 italic hidden">No excluded words yet.</p>
            </section>
        </main>

        <!-- Footer -->
        <footer class="pt-12 border-t border-[#22223B]/10 flex flex-col items-start gap-4">
            <button id="logoutBtn" class="text-xs font-bold uppercase flex items-center gap-2 hover:line-through focus:outline-none">
                <i data-lucide="log-out" class="w-4 h-4"></i> Log Out
            </button>
            <button id="deleteBtn" class="text-xs font-bold uppercase flex items-center gap-2 text-red-700 hover:line-through focus:outline-none">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Delete Account
            </button>
        </footer>
    </div>

    <script>
    // ── Cursor ────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
        const $bigBall    = document.querySelector('.cursor__ball--big');
        const $smallBall  = document.querySelector('.cursor__ball--small');
        const $cursor     = document.querySelector('.cursor');
        const $hoverables = document.querySelectorAll('.hoverable');

        let bigScale = 1, bigX = 0, bigY = 0, mouseX = 0, mouseY = 0;

        document.body.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY;
            $smallBall.style.transform = `translate(${mouseX - 5}px, ${mouseY - 5}px)`;
            $cursor.hidden = false;
        });

        for (let i = 0; i < $hoverables.length; i++) {
            $hoverables[i].addEventListener('mouseenter', () => animateScale(4));
            $hoverables[i].addEventListener('mouseleave', () => animateScale(1));
            $hoverables[i].addEventListener('mousedown',  () => animateScale(3));
            $hoverables[i].addEventListener('mouseup',    () => animateScale(4));
        }

        function animateBigBall() {
            bigX += (mouseX - 15 - bigX) * 0.15;
            bigY += (mouseY - 15 - bigY) * 0.15;
            $bigBall.style.transform = `translate(${bigX}px, ${bigY}px) scale(${bigScale})`;
            requestAnimationFrame(animateBigBall);
        }
        animateBigBall();

        function animateScale(target) {
            let start = bigScale, frame = 0;
            function step() {
                frame++;
                bigScale = start + (target - start) * (frame / 10);
                if (frame < 10) requestAnimationFrame(step);
                else bigScale = target;
            }
            requestAnimationFrame(step);
        }
    });

    // ── Supabase ──────────────────────────────────────────────────────────
    const SUPABASE_URL      = 'https://ypktiqorqpytqrfufbpj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_r3U8mKoht6QE22lYTJ5D0Q_VqnT2bNm';
    const supabaseClient    = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ── State ─────────────────────────────────────────────────────────────
    let knownWords    = [];
    let excludedWords = [];
    let customWords   = [];
    let currentUserId = null;

    // ── DOM refs ──────────────────────────────────────────────────────────
    const knownWordsContainer    = document.getElementById('knownWordsContainer');
    const excludedWordsContainer = document.getElementById('excludedWordsContainer');
    const customWordsContainer   = document.getElementById('customWordsContainer');
    const excludeForm            = document.getElementById('excludeForm');
    const customWordForm         = document.getElementById('customWordForm');
    const newExcludedWordInput   = document.getElementById('newExcludedWordInput');
    const newCustomWordInput     = document.getElementById('newCustomWordInput');
    const saveBtn                = document.getElementById('saveBtn');
    const logoutBtn              = document.getElementById('logoutBtn');
    const deleteBtn              = document.getElementById('deleteBtn');
    const displayNameInput       = document.getElementById('displayName');
    const cefrLevelInput         = document.getElementById('cefrLevel');
    const interestsInput         = document.getElementById('interests');
    const excludedWordsEmpty     = document.getElementById('excludedWordsEmpty');
    const customWordsEmpty       = document.getElementById('customWordsEmpty');

    // ── Helpers ───────────────────────────────────────────────────────────
    // Splits "hello,hi, welcome" → ["hello", "hi", "welcome"]
    function parseWords(raw) {
        return raw
            .split(',')
            .map(w => w.trim().toLowerCase())
            .filter(w => w.length > 0);
    }

    function toast(msg, color = '#22223B') {
        const el = document.createElement('div');
        el.className = 'fixed top-10 left-1/2 -translate-x-1/2 px-6 py-3 font-bold uppercase text-xs z-50 text-white transition-opacity duration-500';
        el.style.cssText = `background:${color}; font-family:'Roboto Mono',monospace;`;
        el.innerText = msg;
        document.body.appendChild(el);
        setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 500); }, 1800);
    }

    // ── Session restore ───────────────────────────────────────────────────
    async function restoreSession() {
        try {
            const res = await fetch('/api/session');
            if (!res.ok) return;
            const { access_token, refresh_token } = await res.json();
            await supabaseClient.auth.setSession({ access_token, refresh_token });
        } catch (e) { console.error('Session restore failed:', e); }
    }

    // ── Load profile ──────────────────────────────────────────────────────
    async function loadProfile() {
        const { data: { user } } = await supabaseClient.auth.getUser();
        if (!user) { window.location.href = '/'; return; }
        currentUserId = user.id;

        const { data, error } = await supabaseClient
            .from('profiles')
            .select('display_name, level, interests, known_words, exclude_words, custom_words')
            .eq('id', user.id)
            .single();

        if (error) { console.error('Load error:', error.message); return; }

        displayNameInput.value = data.display_name || '';
        cefrLevelInput.value   = data.level        || '';
        interestsInput.value   = data.interests    || '';
        knownWords             = data.known_words   || [];
        excludedWords          = data.exclude_words || [];
        customWords            = data.custom_words  || [];

        renderKnownWords();
        renderExcludedWords();
        renderCustomWords();
    }

    // ── Renderers ──────────────────────────────────────────────────────────
    function makeTag(word, onRemove, className) {
        const btn = document.createElement('button');
        btn.className = `${className} px-3 py-1 text-xs transition-all flex items-center gap-2 focus:outline-none`;
        btn.innerHTML = `${word} <i data-lucide="x" class="w-3 h-3"></i>`;
        btn.onclick = onRemove;
        return btn;
    }

    function renderKnownWords() {
        knownWordsContainer.innerHTML = '';
        knownWords.forEach(word => {
            const btn = makeTag(word, async () => {
                knownWords = knownWords.filter(w => w !== word);
                renderKnownWords();
                await supabaseClient.from('profiles').update({ known_words: knownWords }).eq('id', currentUserId);
            }, 'border border-[#22223B] hover:bg-[#22223B] hover:text-[#F2E9E4]');
            knownWordsContainer.appendChild(btn);
        });
        lucide.createIcons();
    }

    function renderExcludedWords() {
        excludedWordsContainer.innerHTML = '';
        excludedWordsEmpty.classList.toggle('hidden', excludedWords.length > 0);
        excludedWords.forEach(word => {
            const btn = makeTag(word, async () => {
                excludedWords = excludedWords.filter(w => w !== word);
                renderExcludedWords();
                await supabaseClient.from('profiles').update({ exclude_words: excludedWords }).eq('id', currentUserId);
            }, 'bg-[#22223B] text-[#F2E9E4] hover:bg-[#22223B]/80');
            excludedWordsContainer.appendChild(btn);
        });
        lucide.createIcons();
    }

    function renderCustomWords() {
        customWordsContainer.innerHTML = '';
        customWordsEmpty.classList.toggle('hidden', customWords.length > 0);
        customWords.forEach(word => {
            const btn = makeTag(word, async () => {
                customWords = customWords.filter(w => w !== word);
                renderCustomWords();
                await supabaseClient.from('profiles').update({ custom_words: customWords }).eq('id', currentUserId);
            }, 'custom-tag');
            customWordsContainer.appendChild(btn);
        });
        lucide.createIcons();
    }

    // ── Add words (comma-split) ────────────────────────────────────────────
    async function addWords(input, list, renderFn, dbField) {
        const newWords = parseWords(input.value);
        if (!newWords.length) return;

        let added = 0;
        newWords.forEach(w => { if (!list.includes(w)) { list.push(w); added++; } });
        input.value = '';
        renderFn();

        if (added > 0) {
            await supabaseClient.from('profiles').update({ [dbField]: list }).eq('id', currentUserId);
            if (added > 1) toast(`${added} words added`);
        }
    }

    excludeForm.onsubmit = e => {
        e.preventDefault();
        addWords(newExcludedWordInput, excludedWords, renderExcludedWords, 'exclude_words');
    };

    customWordForm.onsubmit = e => {
        e.preventDefault();
        addWords(newCustomWordInput, customWords, renderCustomWords, 'custom_words');
    };

    // ── Save profile ───────────────────────────────────────────────────────
    saveBtn.onclick = async () => {
        saveBtn.innerText = '[...]';
        saveBtn.disabled  = true;

        const { error } = await supabaseClient.from('profiles').update({
            display_name:  displayNameInput.value.trim(),
            level:         cefrLevelInput.value.trim(),
            interests:     interestsInput.value.trim(),
            known_words:   knownWords,
            exclude_words: excludedWords,
            custom_words:  customWords,
        }).eq('id', currentUserId);

        if (error) {
            console.error('Save error:', error.message);
            toast('Error saving', '#C1121F');
            saveBtn.innerText = '[Save]';
            saveBtn.disabled  = false;
        } else {
            saveBtn.innerText = '[Saved]';
            setTimeout(() => { saveBtn.innerText = '[Save]'; saveBtn.disabled = false; }, 2000);
        }
    };

    // ── Logout ─────────────────────────────────────────────────────────────
    logoutBtn.onclick = async () => {
        await supabaseClient.auth.signOut();
        window.location.href = '/';
    };

    // ── Delete account ─────────────────────────────────────────────────────
    deleteBtn.onclick = async () => {
        if (!confirm('This will permanently delete your account and all data. Are you sure?')) return;
        await supabaseClient.from('profiles').delete().eq('id', currentUserId);
        await supabaseClient.auth.signOut();
        toast('Account deleted', '#C1121F');
        setTimeout(() => { window.location.href = '/'; }, 1500);
    };

    // ── Init ───────────────────────────────────────────────────────────────
    window.onload = async () => {
        lucide.createIcons();
        await restoreSession();
        await loadProfile();
    };
    </script>
</body>
</html>
