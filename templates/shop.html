<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>loom - shop</title>
  <link rel="icon" href="{{ url_for('static', filename='.module/favicon.ico') }}" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,400;0,700;0,900;1,400&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Cursor -->
  <link rel="stylesheet" href="{{ url_for('static', filename='.module/cursor/style.css') }}">
  <script src="{{ url_for('static', filename='.module/cursor/script.js') }}"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>

  <style>
    :root {
      --dark: #22223B;
      --light: #F2E9E4;
      --accent: #9A8C98;
      --muted: #4A4E69;
      --gold: #F5C842;
      --danger: #C1121F;
      --green: #4CAF50;
      --font: "Roboto Mono", monospace;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      cursor: none !important;
      user-select: none;
    }

    body {
      background: var(--dark);
      color: var(--light);
      font-family: var(--font);
      min-height: 100vh;
      padding: 2rem;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      max-width: 1100px;
      margin: 0 auto 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 1.5rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-icon {
      width: 2.6rem;
      height: 2.6rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
    }

    .logo h1 {
      font-size: 2rem;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -0.04em;
      text-transform: uppercase;
    }

    .header-sub {
      margin-top: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .badge {
      font-size: 0.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 0.3rem 0.85rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.04);
      color: var(--accent);
    }

    #sync-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
      transition: background 0.3s;
    }

    #sync-dot.syncing {
      background: var(--gold);
      animation: blink 0.7s ease-in-out infinite;
    }

    #sync-dot.synced {
      background: var(--green);
    }

    #sync-dot.error {
      background: var(--danger);
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.3
      }
    }

    .stat-cards {
      display: flex;
      gap: 0.8rem;
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.8rem 1.4rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }

    .stat-card .label {
      font-size: 0.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--accent);
      opacity: 0.7;
    }

    .stat-card .value {
      font-size: 1.1rem;
      font-weight: 900;
      font-family: var(--font);
    }

    #loomlars-value {
      color: var(--gold);
    }

    #timer-value {
      color: var(--light);
      font-size: 0.95rem;
    }

    /* TABS */
    .tabs {
      max-width: 1100px;
      margin: 0 auto 1.5rem;
      display: flex;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      font-family: var(--font);
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 0.75rem 1.6rem;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: -1px;
    }

    .tab-btn:hover {
      color: var(--light);
    }

    .tab-btn.active {
      color: var(--light);
      border-bottom-color: var(--light);
    }

    .tab-count {
      font-size: 0.55rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.1rem 0.45rem;
      border-radius: 999px;
    }

    .tab-btn.active .tab-count {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* TAB PANELS */
    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    /* MAIN GRID */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 860px) {
      .main {
        grid-template-columns: 1fr;
      }
    }

    /* SHOP CARDS */
    .shop-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }

    @media (max-width: 540px) {
      .shop-grid {
        grid-template-columns: 1fr;
      }
    }

    .shop-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .shop-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
    }

    .card-glow {
      position: absolute;
      top: -3rem;
      right: -3rem;
      width: 8rem;
      height: 8rem;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.18;
      pointer-events: none;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.2rem;
    }

    .item-icon {
      width: 3.5rem;
      height: 3.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .card-badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
    }

    .rarity-badge {
      font-size: 0.55rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 0.25rem 0.6rem;
      border: 1px solid;
    }

    .for-badge {
      font-size: 0.55rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      opacity: 0.7;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
    }

    .card-desc {
      font-size: 0.65rem;
      color: var(--accent);
      opacity: 0.7;
      font-style: italic;
      margin-bottom: 1.2rem;
      line-height: 1.6;
    }

    /* BUTTONS */
    .buy-btn {
      width: 100%;
      padding: 0.85rem;
      font-family: var(--font);
      font-size: 0.75rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.15s;
    }

    .buy-btn.purchasable {
      background: var(--light);
      color: var(--dark);
    }

    .buy-btn.purchasable:hover {
      background: var(--gold);
    }

    .buy-btn.owned {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--accent);
    }

    .buy-btn.equipped {
      background: rgba(76, 175, 80, 0.1);
      border: 1px solid rgba(76, 175, 80, 0.3);
      color: #4CAF50;
    }

    .buy-btn:active {
      transform: scale(0.97);
    }

    .loom-icon {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      vertical-align: middle;
    }

    /* PURCHASE MESSAGE */
    #purchase-msg {
      margin-top: 1rem;
      padding: 0.8rem;
      text-align: center;
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      opacity: 0;
      transition: opacity 0.3s;
      border: 1px solid transparent;
    }

    #purchase-msg.show {
      opacity: 1;
    }

    #purchase-msg.success {
      background: rgba(76, 175, 80, 0.1);
      border-color: rgba(76, 175, 80, 0.3);
      color: #4CAF50;
    }

    #purchase-msg.error {
      background: rgba(193, 18, 31, 0.1);
      border-color: rgba(193, 18, 31, 0.3);
      color: #ef4444;
    }

    /* INVENTORY */
    .inv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
      gap: 0.8rem;
    }

    .inv-filter-row {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-family: var(--font);
      font-size: 0.55rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.3rem 0.7rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--light);
      color: var(--dark);
      border-color: var(--light);
    }

    .inv-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 1rem;
    }

    .inv-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.18s, transform 0.12s;
      user-select: none;
    }

    .inv-card:hover {
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    .inv-card.active-equip {
      border-color: rgba(76, 175, 80, 0.5);
      background: rgba(76, 175, 80, 0.05);
    }

    .inv-card-glow {
      position: absolute;
      top: -2rem;
      right: -2rem;
      width: 5rem;
      height: 5rem;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.2;
      pointer-events: none;
    }

    .inv-icon {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      display: block;
    }

    .inv-name {
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.01em;
      margin-bottom: 0.3rem;
      line-height: 1.3;
    }

    .inv-meta {
      display: flex;
      flex-direction: column;
      gap: 0.18rem;
    }

    .inv-rarity {
      font-size: 0.5rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .inv-tower {
      font-size: 0.5rem;
      color: var(--accent);
      opacity: 0.6;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .inv-equip-badge {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      font-size: 0.45rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0.15rem 0.4rem;
      background: rgba(76, 175, 80, 0.2);
      border: 1px solid rgba(76, 175, 80, 0.4);
      color: #4CAF50;
    }

    .inv-empty {
      grid-column: 1 / -1;
      padding: 3rem;
      text-align: center;
      color: var(--accent);
      opacity: 0.4;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      border: 1px dashed rgba(255, 255, 255, 0.08);
    }

    /* skeleton */
    .skeleton {
      background: linear-gradient(90deg, rgba(255, 255, 255, 0.04) 25%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.04) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: 200% 0
      }

      100% {
        background-position: -200% 0
      }
    }

    .skel-card {
      height: 140px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* PREVIEW PANEL */
    .preview-panel {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      position: sticky;
      top: 1.5rem;
    }

    .preview-label {
      font-size: 0.55rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: var(--accent);
      opacity: 0.6;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .preview-canvas {
      display: block;
      width: 100%;
      max-width: 240px;
    }

    .tower-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      width: 100%;
    }

    .tower-pick-btn {
      font-family: var(--font);
      font-size: 0.55rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0.35rem 0.7rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      transition: all 0.15s;
    }

    .tower-pick-btn.active,
    .tower-pick-btn:hover {
      background: var(--light);
      color: var(--dark);
      border-color: var(--light);
    }

    .skin-status {
      width: 100%;
      padding: 0.8rem;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.06);
      background: rgba(0, 0, 0, 0.25);
      font-size: 0.6rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent);
      opacity: 0.6;
    }

    .skin-status.active-skin {
      color: #4CAF50;
      opacity: 1;
    }
  </style>
</head>

  <script>
    // ═══════════════════════════════════════════════════
    //  SUPABASE
    // ═══════════════════════════════════════════════════
    const SUPABASE_URL = 'https://ypktiqorqpytqrfufbpj.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_r3U8mKoht6QE22lYTJ5D0Q_VqnT2bNm';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function restoreSession() {
      try {
        const r = await fetch('/api/session');
        if (!r.ok) return;
        const { access_token, refresh_token } = await r.json();
        await sb.auth.setSession({ access_token, refresh_token });
      } catch (_) { }
    }

    async function getUid() {
      const { data: { user } } = await sb.auth.getUser();
      return user?.id ?? null;
    }

    function dot(state) {
      const el = document.getElementById('sync-dot');
      el.className = state;
      el.title = { syncing: 'Syncing…', synced: 'Saved', error: 'Sync error' }[state] ?? '';
    }

    async function loadProfile() {
      dot('syncing');
      const uid = await getUid();
      if (!uid) { dot('error'); return; }

      const { data, error } = await sb
        .from('profiles')
        .select('loomlars, owned_items, equipped_skins')
        .eq('id', uid)
        .single();

      if (error) { dot('error'); console.error(error.message); return; }

      loomlars = data?.loomlars ?? 0;
      ownedItems = data?.owned_items ?? [];
      equippedSkins = data?.equipped_skins ?? {};

      // Rebuild runtime equippedAccessory from the persisted map
      // Use the first equipped entry as the "active" one for display
      equippedAccessory = null;
      for (const [tId, aId] of Object.entries(equippedSkins)) {
        const acc = ALL_ACCESSORIES.find(a => a.id === aId);
        const tow = TOWERS.find(t => t.id === tId);
        if (acc && tow) { equippedAccessory = { accessory: acc, towerId: tId }; break; }
      }

      renderLoomlars();
      updateInvCount();
      renderShop();
      renderInventory();
      renderAllStatuses();
      dot('synced');
    }

    let _saveTimer = null;
    function scheduleSave() {
      clearTimeout(_saveTimer);
      _saveTimer = setTimeout(async () => {
        dot('syncing');
        const uid = await getUid();
        if (!uid) { dot('error'); return; }
        const { error } = await sb
          .from('profiles')
          .update({ loomlars, owned_items: ownedItems, equipped_skins: equippedSkins })
          .eq('id', uid);
        error ? dot('error') : dot('synced');
        if (error) console.error(error.message);
      }, 600);
    }

    // ═══════════════════════════════════════════════════
    //  DATA
    // ═══════════════════════════════════════════════════
    const TOWERS = [
      { id: 'sentry', name: 'Sentry', shape: 'square' },
      { id: 'sharp', name: 'Sharp', shape: 'diamond' },
      { id: 'frost', name: 'Frost', shape: 'hexagon' },
      { id: 'tesla', name: 'Tesla', shape: 'star' },
      { id: 'bomber', name: 'Bomber', shape: 'octagon' },
      { id: 'banker', name: 'Banker', shape: 'circle' },
      { id: 'rail', name: 'Rail', shape: 'triangle' },
      { id: 'void', name: 'Void', shape: 'star' },
    ];

    const ALL_ACCESSORIES = [
      { id: 'viking_helmet', name: 'Viking Helmet', rarity: 'Rare', desc: 'Sentry looks ready for Valhalla.', icon: '🪖', color: '#2563eb' },
      { id: 'wizard_hat', name: 'Sorcerer Hat', rarity: 'Epic', desc: 'Star-stitched fabric for magic towers.', icon: '🧙', color: '#7c3aed' },
      { id: 'monocle', name: 'Elite Monocle', rarity: 'Common', desc: 'Precision vision for any unit.', icon: '🧐', color: '#64748b' },
      { id: 'cape_red', name: 'Heroic Cape', rarity: 'Legendary', desc: 'Flutters majestically behind the square.', icon: '🧣', color: '#ca8a04' },
      { id: 'glasses_cool', name: 'Tactical Shades', rarity: 'Uncommon', desc: 'Style is the best defense.', icon: '🕶️', color: '#16a34a' },
      { id: 'crown_gold', name: "King's Crown", rarity: 'Legendary', desc: 'The ultimate royal upgrade.', icon: '👑', color: '#ca8a04' },
      { id: 'bunny_ears', name: 'Rabbit Ears', rarity: 'Common', desc: 'Oddly adorable on a stone unit.', icon: '🐰', color: '#64748b' },
      { id: 'cyber_eye', name: 'Cybernetic Eye', rarity: 'Epic', desc: 'Neon components from the future.', icon: '👁️', color: '#7c3aed' },
      { id: 'pirate_hat', name: 'Pirate Tricorne', rarity: 'Rare', desc: 'Smells of sea salt and black powder.', icon: '🏴‍☠️', color: '#2563eb' },
      { id: 'halo', name: 'Angelic Halo', rarity: 'Legendary', desc: 'Divine light for high-tier defenses.', icon: '😇', color: '#ca8a04' },
      { id: 'leaf_crown', name: 'Forest Diadem', rarity: 'Uncommon', desc: 'Woven from eternal spring leaves.', icon: '🌿', color: '#16a34a' },
      { id: 'phoenix_wing', name: 'Phoenix Soul', rarity: 'Mythical', desc: 'Burning with an undying flame.', icon: '🔥', color: '#dc2626' },
      { id: 'void_mask', name: 'Void Reaver Mask', rarity: 'Mythical', desc: 'A relic from the space between worlds.', icon: '👺', color: '#dc2626' },
    ];

    const RARITY = {
      Common: { weight: 50, cost: 2, text: '#94a3b8', border: 'rgba(148,163,184,0.35)', bg: 'rgba(148,163,184,0.08)' },
      Uncommon: { weight: 30, cost: 5, text: '#4ade80', border: 'rgba(74,222,128,0.35)', bg: 'rgba(74,222,128,0.08)' },
      Rare: { weight: 15, cost: 10, text: '#60a5fa', border: 'rgba(96,165,250,0.35)', bg: 'rgba(96,165,250,0.08)' },
      Epic: { weight: 5, cost: 15, text: '#c084fc', border: 'rgba(192,132,252,0.35)', bg: 'rgba(192,132,252,0.08)' },
      Legendary: { weight: 1, cost: 30, text: '#fbbf24', border: 'rgba(251,191,36,0.35)', bg: 'rgba(251,191,36,0.08)' },
      Mythical: { weight: 0.1, cost: 50, text: '#f87171', border: 'rgba(248,113,113,0.35)', bg: 'rgba(248,113,113,0.08)' },
    };

    // ═══════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════
    let loomlars = 0;
    let ownedItems = [];   // [{accessoryId, towerId}]
    let equippedSkins = {};   // { towerId: accessoryId }  ← persisted in DB
    let equippedAccessory = null; // runtime convenience { accessory, towerId }
    let selectedTowerShop = TOWERS[0];
    let selectedTowerInv = TOWERS[0];
    let invFilter = 'all';
    let _msgTimer = null;

    // Daily shop build
    function buildShop() {
      const now = new Date();
      let seed = parseInt(`${now.getUTCFullYear()}${now.getUTCMonth()}${now.getUTCDate()}`);
      const rng = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
      return Array.from({ length: 4 }, (_, i) => {
        const roll = rng() * 100;
        let cum = 0, rarity = 'Common';
        for (const [r, c] of Object.entries(RARITY)) { cum += c.weight; if (roll <= cum) { rarity = r; break; } }
        const pool = ALL_ACCESSORIES.filter(a => a.rarity === rarity);
        const base = pool[Math.floor(rng() * pool.length)] || ALL_ACCESSORIES[0];
        return { ...base, cost: RARITY[rarity].cost, targetTower: TOWERS[i % 3] };
      });
    }
    const SHOP = buildShop();

    // Countdown
    function updateTimer() {
      const now = new Date(), t = new Date(now);
      t.setUTCHours(24, 0, 0, 0);
      const d = t - now, pad = n => String(Math.floor(n)).padStart(2, '0');
      document.getElementById('timer-value').textContent =
        `${pad(d / 3600000)}:${pad((d % 3600000) / 60000)}:${pad((d % 60000) / 1000)}`;
    }
    setInterval(updateTimer, 1000); updateTimer();

    function renderLoomlars() { document.getElementById('loomlars-value').textContent = loomlars.toLocaleString(); }
    function updateInvCount() { document.getElementById('inv-count').textContent = ownedItems.length; }

    // ═══════════════════════════════════════════════════
    //  TABS
    // ═══════════════════════════════════════════════════
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === `tab-${btn.dataset.tab}`));
      };
    });

    // ═══════════════════════════════════════════════════
    //  CANVAS
    // ═══════════════════════════════════════════════════
    function drawShape(ctx, x, y, size, shape) {
      ctx.beginPath();
      switch (shape) {
        case 'square': ctx.rect(x - size, y - size, size * 2, size * 2); break;
        case 'diamond': ctx.moveTo(x, y - size * 1.2); ctx.lineTo(x + size, y); ctx.lineTo(x, y + size * 1.2); ctx.lineTo(x - size, y); break;
        case 'circle': ctx.arc(x, y, size, 0, Math.PI * 2); break;
        case 'hexagon': for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; i ? ctx.lineTo(x + size * Math.cos(a), y + size * Math.sin(a)) : ctx.moveTo(x + size * Math.cos(a), y + size * Math.sin(a)); } break;
        case 'triangle': ctx.moveTo(x, y - size * 1.2); ctx.lineTo(x + size * 1.2, y + size); ctx.lineTo(x - size * 1.2, y + size); break;
        case 'octagon': for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + Math.PI / 8; i ? ctx.lineTo(x + size * Math.cos(a), y + size * Math.sin(a)) : ctx.moveTo(x + size * Math.cos(a), y + size * Math.sin(a)); } break;
        case 'star': for (let i = 0; i < 10; i++) { const r = (i % 2 === 0) ? size : size * 0.4, a = i * Math.PI / 5 - Math.PI / 2; i ? ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a)) : ctx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a)); } break;
      }
      ctx.closePath();
    }

    function paintCanvas(canvas, tower, skinEntry) {
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height, cx = W / 2, cy = H / 2;
      const t = Date.now(), isVoid = tower.id === 'void', size = 42;
      const drawY = cy + Math.sin(t * 0.00188) * 8;

      ctx.clearRect(0, 0, W, H);

      // shadow
      ctx.save(); ctx.beginPath();
      ctx.ellipse(cx, cy + size + 6, size * 0.9, size * 0.175, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.22)'; ctx.fill(); ctx.restore();

      // orbit ring
      ctx.save(); ctx.translate(cx, drawY); ctx.rotate(t * 0.00005);
      ctx.strokeStyle = '#9A8C98'; ctx.lineWidth = 1; ctx.globalAlpha = 0.2;
      ctx.beginPath(); ctx.ellipse(0, 0, size + 14, (size + 14) * 0.35, 0, 0, Math.PI * 2); ctx.stroke(); ctx.restore();

      if (isVoid) {
        ctx.save(); ctx.translate(cx, drawY); ctx.rotate(-t * 0.00003);
        ctx.strokeStyle = '#9d4edd'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.35;
        drawShape(ctx, 0, 0, size * 1.6, 'hexagon'); ctx.stroke(); ctx.restore();
      }

      ctx.save(); ctx.translate(cx, drawY);
      ctx.shadowBlur = 24; ctx.shadowColor = isVoid ? '#9d4edd' : 'rgba(242,233,228,0.3)';
      ctx.fillStyle = isVoid ? '#3c096c' : '#4A4E69'; drawShape(ctx, 0, 0, size, tower.shape); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = isVoid ? '#9d4edd' : '#9A8C98'; ctx.lineWidth = 2.5; drawShape(ctx, 0, 0, size, tower.shape); ctx.stroke();
      ctx.globalAlpha = 0.35 * (0.7 + 0.3 * Math.sin(t * 0.003));
      ctx.fillStyle = isVoid ? '#e0aaff' : '#F2E9E4'; drawShape(ctx, 0, 0, size * 0.45, tower.shape); ctx.fill();
      ctx.globalAlpha = 1; ctx.restore();

      // accessory overlay
      if (skinEntry) {
        const acc = ALL_ACCESSORIES.find(a => a.id === skinEntry);
        if (acc) {
          ctx.save();
          ctx.font = `${size * 1.55}px serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.translate(cx, drawY); ctx.rotate(Math.sin(t * 0.001) * 3 * Math.PI / 180);
          ctx.fillText(acc.icon, 0, 0); ctx.restore();
        }
      }
    }

    const canvasShop = document.getElementById('canvas-shop');
    const canvasInv = document.getElementById('canvas-inv');

    function animLoop() {
      paintCanvas(canvasShop, selectedTowerShop, equippedSkins[selectedTowerShop.id] ?? null);
      paintCanvas(canvasInv, selectedTowerInv, equippedSkins[selectedTowerInv.id] ?? null);
      requestAnimationFrame(animLoop);
    }

    // ═══════════════════════════════════════════════════
    //  SHOP RENDERING
    // ═══════════════════════════════════════════════════
    const LOOM = `<svg class="loom-icon" viewBox="0 0 563 562" fill="currentColor"><g transform="translate(-1261,-14)"><path d="M1530.5,574.5C1513.4,570.6 1501.5,562.9 1494.8,551.1C1493.5,548.8 1491.6,546.7 1490.5,546.5C1472.1,542.2 1427.4,541.1 1393,544.1C1366,546.4 1316.8,554.8 1282.8,562.9C1268.8,566.3 1266.8,566.1 1263.1,561.4L1261,558.7L1261,315.1C1261,150.6 1261.3,70.3 1262,67.8C1263.8,61.6 1265.5,61 1281.6,61C1289.4,61 1296.5,60.7 1297.4,60.4C1298.8,59.9 1299,57.6 1299,45.8C1299,29.9 1299.9,26.8 1305.2,25.1C1313.9,22.4 1350.1,16.9 1372.9,14.9C1390.3,13.4 1430.6,14.2 1446.5,16.5C1485.2,21.8 1516,33.9 1539,52.6L1546.6,58.7L1550.5,55.3C1556.6,50.2 1571.6,40.2 1579.1,36.4C1601.2,25.3 1624,18.9 1654.1,15.4C1673.3,13.2 1714.8,13.9 1739.5,16.9C1759,19.3 1784.3,23.5 1788.1,25.1C1792.4,26.8 1793,29.4 1793.3,45.5L1793.5,60.5L1808.8,60.8L1824,61.1L1824,565.9L1820.8,565.3C1819,565 1812.8,563.6 1807,562.3C1729.7,544.3 1667.1,538.5 1615.4,544.5C1608.3,545.4 1601.8,546.3 1601,546.5C1600.2,546.8 1598.7,548.8 1597.7,550.9C1593.2,560.7 1579.5,570 1563.6,574C1554.4,576.3 1539.8,576.5 1530.5,574.5Z"/></g></svg>`;

    function renderShop() {
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = '';
      SHOP.forEach((item, idx) => {
        const cfg = RARITY[item.rarity];
        const isOwned = ownedItems.some(o => o.accessoryId === item.id && o.towerId === item.targetTower.id);
        const isEquipped = equippedSkins[item.targetTower.id] === item.id;

        let btn;
        if (!isOwned) btn = `<button class="buy-btn purchasable" data-idx="${idx}">${LOOM} ${item.cost}</button>`;
        else if (isEquipped) btn = `<button class="buy-btn equipped"    data-idx="${idx}">✓ EQUIPPED</button>`;
        else btn = `<button class="buy-btn owned"       data-idx="${idx}">USE SKIN</button>`;

        const card = document.createElement('div');
        card.className = 'shop-card';
        card.innerHTML = `
      <div class="card-glow" style="background:${item.color}"></div>
      <div class="card-top">
        <div class="item-icon" style="background:${item.color}22;border-color:${item.color}33">${item.icon}</div>
        <div class="card-badges">
          <span class="rarity-badge" style="color:${cfg.text};border-color:${cfg.border};background:${cfg.bg}">${item.rarity}</span>
          <span class="for-badge">FOR: ${item.targetTower.name.toUpperCase()}</span>
        </div>
      </div>
      <div class="card-name">${item.name}</div>
      <div class="card-desc">"${item.desc}"</div>
      ${btn}
    `;
        grid.appendChild(card);
      });

      document.querySelectorAll('#shop-grid [data-idx]').forEach(b => {
        b.onclick = () => {
          const idx = parseInt(b.dataset.idx);
          if (b.classList.contains('purchasable')) handleBuy(idx);
          else toggleSkin(SHOP[idx].id, SHOP[idx].targetTower.id);
        };
      });
    }

    function handleBuy(idx) {
      const item = SHOP[idx];
      if (loomlars < item.cost) { flash('Not enough Loomlars!', 'error'); return; }
      loomlars -= item.cost;
      ownedItems.push({ accessoryId: item.id, towerId: item.targetTower.id });
      renderLoomlars();
      updateInvCount();
      scheduleSave();
      flash(`${item.name} purchased!`, 'success');
      renderShop();
      renderInventory();
    }

    function flash(text, type) {
      const el = document.getElementById('purchase-msg');
      el.textContent = text; el.className = `show ${type}`;
      clearTimeout(_msgTimer);
      _msgTimer = setTimeout(() => el.className = '', 2800);
    }

    // ═══════════════════════════════════════════════════
    //  EQUIP SYSTEM (shared by shop + inventory)
    // ═══════════════════════════════════════════════════
    function toggleSkin(accessoryId, towerId) {
      const already = equippedSkins[towerId] === accessoryId;
      if (already) {
        delete equippedSkins[towerId];
      } else {
        equippedSkins[towerId] = accessoryId;
        // Point preview canvases to this tower
        const tow = TOWERS.find(t => t.id === towerId);
        if (tow) { selectedTowerShop = tow; selectedTowerInv = tow; }
        updatePickerHighlights();
      }
      scheduleSave();
      renderShop();
      renderInventory();
      renderAllStatuses();
    }

    // ═══════════════════════════════════════════════════
    //  INVENTORY RENDERING
    // ═══════════════════════════════════════════════════
    function renderInventory() {
      const grid = document.getElementById('inv-grid');
      grid.innerHTML = '';

      const fullItems = ownedItems.map(o => {
        const acc = ALL_ACCESSORIES.find(a => a.id === o.accessoryId);
        const tow = TOWERS.find(t => t.id === o.towerId);
        return (acc && tow) ? { ...acc, targetTower: tow } : null;
      }).filter(Boolean);

      const filtered = invFilter === 'all' ? fullItems : fullItems.filter(i => i.rarity === invFilter);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="inv-empty">${ownedItems.length === 0
            ? 'No items yet — visit the shop!'
            : 'No items match this filter.'
          }</div>`;
        return;
      }

      filtered.forEach(item => {
        const cfg = RARITY[item.rarity];
        const isEquipped = equippedSkins[item.targetTower.id] === item.id;
        const card = document.createElement('div');
        card.className = 'inv-card' + (isEquipped ? ' active-equip' : '');
        card.innerHTML = `
      ${isEquipped ? '<span class="inv-equip-badge">Equipped</span>' : ''}
      <div class="inv-card-glow" style="background:${item.color}"></div>
      <span class="inv-icon">${item.icon}</span>
      <div class="inv-name">${item.name}</div>
      <div class="inv-meta">
        <span class="inv-rarity" style="color:${cfg.text}">${item.rarity}</span>
        <span class="inv-tower">▸ ${item.targetTower.name}</span>
      </div>
    `;
        card.onclick = () => toggleSkin(item.id, item.targetTower.id);
        grid.appendChild(card);
      });
    }

    // Filters
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = () => {
        invFilter = btn.dataset.filter;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
        renderInventory();
      };
    });

    // ═══════════════════════════════════════════════════
    //  TOWER PICKERS
    // ═══════════════════════════════════════════════════
    function buildPickers() {
      ['picker-shop', 'picker-inv'].forEach(id => {
        const el = document.getElementById(id);
        el.innerHTML = '';
        const isShop = id === 'picker-shop';
        TOWERS.forEach(t => {
          const btn = document.createElement('button');
          const sel = isShop ? selectedTowerShop : selectedTowerInv;
          btn.className = 'tower-pick-btn' + (t.id === sel.id ? ' active' : '');
          btn.textContent = t.name; btn.dataset.tid = t.id;
          btn.onclick = () => {
            if (isShop) { selectedTowerShop = t; }
            else { selectedTowerInv = t; }
            updatePickerHighlights();
            renderAllStatuses();
          };
          el.appendChild(btn);
        });
      });
    }

    function updatePickerHighlights() {
      document.querySelectorAll('#picker-shop .tower-pick-btn').forEach(b => b.classList.toggle('active', b.dataset.tid === selectedTowerShop.id));
      document.querySelectorAll('#picker-inv  .tower-pick-btn').forEach(b => b.classList.toggle('active', b.dataset.tid === selectedTowerInv.id));
    }

    function renderAllStatuses() {
      const shopEq = equippedSkins[selectedTowerShop.id];
      const invEq = equippedSkins[selectedTowerInv.id];

      const sShop = document.getElementById('status-shop');
      const sInv = document.getElementById('status-inv');

      if (shopEq) {
        const acc = ALL_ACCESSORIES.find(a => a.id === shopEq);
        sShop.textContent = `${acc?.name ?? shopEq} ACTIVE`;
        sShop.className = 'skin-status active-skin';
      } else {
        sShop.textContent = 'No skin equipped'; sShop.className = 'skin-status';
      }

      if (invEq) {
        const acc = ALL_ACCESSORIES.find(a => a.id === invEq);
        sInv.textContent = `${acc?.name ?? invEq} ACTIVE`;
        sInv.className = 'skin-status active-skin';
      } else {
        sInv.textContent = 'No skin equipped'; sInv.className = 'skin-status';
      }
    }

    // ═══════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════
    (async () => {
      renderShop();
      buildPickers();
      renderAllStatuses();
      renderLoomlars();
      animLoop();

      await restoreSession();
      await loadProfile();
      buildPickers(); // rebuild after tower state restored
    })();
  </script>
</body>
