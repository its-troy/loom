<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
        
    <!-- Cursor -->
    <link rel="stylesheet" href="{{ url_for('static', filename='.module/cursor/style.css') }}">
    <script src="{{ url_for('static', filename='.module/cursor/script.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>

    <style>
        :root {
            --dark: #22223B;
            --light: #F2E9E4;
            --accent: #9A8C98;
            --muted: #4A4E69;
            --font-mono: "Roboto Mono", "Vazirmatn", monospace;
            --font-roboto: "Roboto", sans-serif;
        }

        * { user-select: none !important; cursor: none !important; }
        *::-webkit-scrollbar { display: none; }

        .answer:hover { background-color: var(--light) !important; color: var(--dark) !important; }

        body {
            background-color: var(--dark);
            color: var(--light);
            font-family: var(--font-mono);
            overflow: hidden;
            touch-action: none;
        }

        canvas {
            background: #1a1a2e;
            border: 1px solid var(--muted);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .ui-panel { background: var(--dark); border: 1px solid var(--muted); }

        .upgrade-card {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 0.3rem 0.2rem;
            transition: all 0.2s; cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--muted); color: var(--light);
        }
        .upgrade-card:hover:not(:disabled) { background: var(--light); color: var(--dark); }
        .upgrade-card:disabled { opacity: 0.2; cursor: not-allowed; }

        .tower-btn {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 0.4rem 0.25rem;
            font-weight: bold; border: 1px solid rgba(255,255,255,0.1);
            font-size: 10px; cursor: grab; transition: all 0.15s;
            background: var(--dark); color: var(--accent);
        }
        .tower-btn:active { cursor: grabbing; }
        .tower-btn:hover:not(:disabled) { background-color: var(--light); color: var(--dark); }
        .tower-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .tower-btn .tower-cost { opacity: 0.5; font-size: 9px; margin-top: 1px; }
        .tower-btn .tower-name { text-transform: uppercase; letter-spacing: 0.05em; }

        h1, h2, h3, button, div, span, p { font-family: var(--font-mono) !important; }

        @keyframes calm-wiggle {
            0%, 100% { transform: rotate(-1.2deg) translateY(0); }
            50% { transform: rotate(1.2deg) translateY(-2px); }
        }
        .wiggle-element { animation: calm-wiggle 6s ease-in-out infinite; display: inline-block; }
        .delay-1 { animation-delay: -1.5s; }
        .delay-2 { animation-delay: -3s; }
        .delay-3 { animation-delay: -4.5s; }

        .logo-container { display: inline-block; animation: calm-wiggle 7s ease-in-out infinite; }
        .logo-container svg { filter: drop-shadow(0 0 2px rgba(242,233,228,0.1)); }

        #quiz-overlay {
            transition: transform 0.25s cubic-bezier(0.2,1,0.3,1), opacity 0.2s ease;
            transform: translateY(100%); opacity: 0; pointer-events: none;
        }
        #quiz-overlay.active { transform: translateY(0); opacity: 1; pointer-events: auto; }

        .fast-pulse { animation: pulse 0.8s cubic-bezier(0.4,0,0.6,1) infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ── SKIN INDICATOR on tower button ── */
        .skin-dot-inline {
            color: #F5C842;
            font-size: 8px;
            text-shadow: 0 0 4px #F5C842;
        }
    </style>
</head>

    // ════════════════════════════════════════════════════════════════════

    // ════════════════════════════════════════════════════════════════════
    //  SHAPE DRAWING
    // ════════════════════════════════════════════════════════════════════
    function drawShape(ctx, x, y, size, shape, outlineOnly = false) {
        ctx.beginPath();
        switch(shape) {
            case 'square':
                ctx.rect(x-size, y-size, size*2, size*2); break;
            case 'diamond':
                ctx.moveTo(x, y-size*1.2); ctx.lineTo(x+size, y);
                ctx.lineTo(x, y+size*1.2); ctx.lineTo(x-size, y); break;
            case 'circle':
                ctx.arc(x, y, size, 0, Math.PI*2); break;
            case 'hexagon':
                for (let i=0;i<6;i++) { const a=i*Math.PI/3; ctx.lineTo(x+size*Math.cos(a), y+size*Math.sin(a)); } break;
            case 'triangle':
                ctx.moveTo(x, y-size*1.2); ctx.lineTo(x+size*1.2, y+size); ctx.lineTo(x-size*1.2, y+size); break;
            case 'octagon':
                for (let i=0;i<8;i++) { const a=i*Math.PI/4+Math.PI/8; ctx.lineTo(x+size*Math.cos(a), y+size*Math.sin(a)); } break;
            case 'star':
                for (let i=0;i<10;i++) { const r=(i%2===0)?size:size*0.4, a=i*Math.PI/5; ctx.lineTo(x+r*Math.cos(a), y+r*Math.sin(a)); } break;
        }
        ctx.closePath();
        if (outlineOnly) ctx.stroke(); else ctx.fill();
    }

    // ════════════════════════════════════════════════════════════════════
    //  SHOP / INIT
    // ════════════════════════════════════════════════════════════════════
    function initShop() {
        const grid = document.getElementById('shop-grid');
        grid.innerHTML = '';
        Object.keys(towerTypes).forEach(key => {
            const t = towerTypes[key];
            const btn = document.createElement('button');
            btn.id = `btn-${key}`;
            btn.className = 'tower-btn';
            const shopId = TOWER_KEY_TO_SHOP_ID[key];
            const hasSkin = !!(equippedSkins[shopId]);
            if (hasSkin) btn.classList.add('has-skin');
            btn.innerHTML = `<span class="tower-name">${t.name}${hasSkin ? ' <span class="skin-dot-inline">✦</span>' : ''}</span><span class="tower-cost">${t.cost}c</span>`;
            btn.onmousedown = () => { if (gold >= t.cost) { draggingTowerType = key; deselectTower(); } };
            grid.appendChild(btn);
        });
    }

    function isOnPath(x, y) {
        for (let i=0; i<path.length-1; i++) {
            const p1=path[i], p2=path[i+1];
            const l2=(p1.x-p2.x)**2+(p1.y-p2.y)**2;
            if (l2===0) continue;
            let t=((x-p1.x)*(p2.x-p1.x)+(y-p1.y)*(p2.y-p1.y))/l2;
            t=Math.max(0,Math.min(1,t));
            const d=(x-(p1.x+t*(p2.x-p1.x)))**2+(y-(p1.y+t*(p2.y-p1.y)))**2;
            if (Math.sqrt(d)<(trackWidth/2+15)) return true;
        }
        return false;
    }

    function selectTower(tower) {
        selectedTower = tower;
        updateUpgradeUI();
        document.getElementById('upgrade-panel').classList.remove('hidden');
    }
    function deselectTower() {
        selectedTower = null;
        document.getElementById('upgrade-panel').classList.add('hidden');
    }

    function updateUpgradeUI() {
        if (!selectedTower) return;
        const t = selectedTower;
        const totalLvl = t.lvls.damage+t.lvls.speed+t.lvls.range-2;
        document.getElementById('sel-tower-name').innerText = `${t.config.name} L${totalLvl}`;
        document.getElementById('up-dmg-label').innerText = t.config.effect==='income' ? 'YLD' : (t.type==='freeze' ? 'SLOW TIME' : 'PWR');
        document.getElementById('up-spd-label').innerText = t.config.effect==='income' ? '---' : (t.config.effect==='splash' ? 'BLT' : 'SPD');
        document.getElementById('up-rng-label').innerText = t.config.effect==='income' ? '---' : 'RNG';
        const paths = {damage:'dmg', speed:'spd', range:'rng'};
        Object.keys(paths).forEach(p => {
            const k=paths[p], lvl=t.lvls[p];
            const cost=Math.floor(t.config.cost*(lvl+1)*1.5);
            if (t.config.effect==='income' && (p==='range'||p==='speed')) {
                document.getElementById(`up-${k}-text`).innerText='--';
                document.getElementById(`up-${k}-cost`).innerText='--';
                document.getElementById(`up-${k}`).disabled=true;
            } else {
                document.getElementById(`up-${k}-text`).innerText=`L${lvl}`;
                document.getElementById(`up-${k}-cost`).innerText= lvl<5 ? `${cost}c` : 'MAX';
                document.getElementById(`up-${k}`).disabled=(lvl>=5||gold<cost);
            }
        });
        document.getElementById('sell-price').innerText=`${Math.floor(t.totalValue*0.7)}c`;
    }

    function upgradeSelected(pathKey) {
        if (!selectedTower) return;
        const t=selectedTower, lvl=t.lvls[pathKey];
        if (lvl>=5) return;
        const cost=Math.floor(t.config.cost*(lvl+1)*1.5);
        if (gold>=cost) {
            gold-=cost; t.lvls[pathKey]++; t.totalValue+=cost;
            if (pathKey==='damage') { if (t.config.effect==='income') t.stats.damage+=5; else if (t.type==='freeze') t.stats.slowDuration=(t.stats.slowDuration||120)+15; else t.stats.damage*=1.8; }
            if (pathKey==='speed')  { if (t.config.effect==='splash') t.stats.splashRadius*=1.4; else t.stats.fireRate*=0.75; }
            if (pathKey==='range')  t.stats.range*=1.25;
            updateUpgradeUI(); updateUI(); createExplosion(t.x, t.y, colors.light, 20);
        }
    }

    function sellSelected() {
        if (!selectedTower) return;
        gold+=Math.floor(selectedTower.totalValue*0.7);
        towers=towers.filter(t=>t!==selectedTower);
        deselectTower(); updateUI();
    }

    // ════════════════════════════════════════════════════════════════════
    //  ENEMY
    // ════════════════════════════════════════════════════════════════════
    class Enemy {
        constructor(waveNum, typeKey='basic') {
            const def=enemyDefinitions[typeKey];
            this.typeKey=typeKey; this.x=path[0].x; this.y=path[0].y;
            this.pathIndex=0; this.baseSpeed=def.speed; this.speed=def.speed;
            this.maxHealth=def.hp; this.health=def.hp;
            this.radius=typeKey==='umbra'?32:(typeKey==='lumen'?30:(typeKey==='boss'?24:(typeKey==='heavy'||typeKey==='tank'?18:(typeKey==='penumbra'?12:11))));
            this.slowTimer=0; this.hitFlashTimer=0; this.dead=false;
            this.baseColor=def.color; this.shape=def.shape; this.effect=def.effect;
            this.abilityTimer=0; this.rotation=0;
        }
        takeDamage(amount, towerEffect) {
            let d=amount;
            if (this.effect==='shield') d*=0.5;
            if (this.effect==='lumen' && towerEffect!=='void' && towerEffect!=='solar') d*=0.25;
            // Lumen heals 1 when hit by solar
            if (this.effect==='lumen' && towerEffect==='solar') {
                this.health=Math.min(this.maxHealth, this.health+1);
                this.hitFlashTimer=5; updateUI(); return;
            }
            // Umbra: resists all but solar; heals 1 on void hit
            if (this.effect==='umbra') {
                if (towerEffect==='void') { this.health=Math.min(this.maxHealth, this.health+1); this.hitFlashTimer=5; updateUI(); return; }
                if (towerEffect!=='solar') d*=0.25;
            }
            // Penumbra: resists everything except solar
            if (this.effect==='penumbra' && towerEffect!=='solar') d*=0.25;
            const fd=Math.min(d, this.health); this.health-=fd;
            if (this.health<=0) enemiesDefeatedTotal++;
            gold+=1; updateUI(); this.hitFlashTimer=8;
        }
        update() {
            this.speed=this.slowTimer>0?this.baseSpeed*0.5:this.baseSpeed;
            if (this.slowTimer>0) this.slowTimer--;
            if (this.hitFlashTimer>0) this.hitFlashTimer--;
            if (this.effect==='umbra') this.rotation+=0.025;

            // Lumen ability: every 10s blind a random tower
            if (this.effect==='lumen') {
                this.abilityTimer++;
                if (this.abilityTimer>=600 && towers.length>0) {
                    this.abilityTimer=0;
                    const t=towers[Math.floor(Math.random()*towers.length)];
                    t.blindTimer=180; // 3 seconds
                    lightRays.push({x1:this.x,y1:this.y,x2:t.x,y2:t.y,life:40,maxLife:40});
                }
            }

            // Umbra ability: immediately spawn 3 penumbra, then every 5s spawn 3 more
            if (this.effect==='umbra') {
                this.abilityTimer++;
                const spawnNow = this.abilityTimer===1 || this.abilityTimer>=300;
                if (spawnNow) {
                    if (this.abilityTimer>1) this.abilityTimer=0;
                    for(let i=0;i<3;i++) {
                        const pen=new Enemy(0,'penumbra');
                        pen.x=path[0].x+(Math.random()-0.5)*10;
                        pen.y=path[0].y+(Math.random()-0.5)*10;
                        pen.pathIndex=0;
                        enemies.push(pen);
                    }
                    createExplosion(this.x,this.y,'#9d4edd',14);
                }
            }

            const target=path[this.pathIndex+1]; if (!target) return;
            const dx=target.x-this.x, dy=target.y-this.y, dist=Math.sqrt(dx*dx+dy*dy);
            if (dist<this.speed) {
                this.pathIndex++;
                if (this.pathIndex>=path.length-1) {
                    health-=(this.typeKey==='umbra'?25:(this.typeKey==='lumen'?20:(this.typeKey==='boss'?15:(this.typeKey==='heavy'?5:1))));
                    updateUI(); this.dead=true;
                }
            } else { this.x+=(dx/dist)*this.speed; this.y+=(dy/dist)*this.speed; }
        }
        draw() {
            ctx.save(); ctx.translate(this.x, this.y);
            const hp=Math.max(0,this.health/this.maxHealth);
            let alpha=0.1+hp*0.8;
            if (hp<0.3) alpha*=(0.6+Math.sin(frameCount*0.5)*0.4);

            // ── UMBRA custom draw ──
            if (this.effect==='umbra') {
                const pulse=0.5+0.5*Math.sin(frameCount*0.07);
                // Outer soft glow
                const og=ctx.createRadialGradient(0,0,this.radius,0,0,this.radius*3.5);
                og.addColorStop(0,'rgba(157,78,221,0.28)');
                og.addColorStop(0.5,'rgba(100,0,200,0.1)');
                og.addColorStop(1,'rgba(80,0,160,0)');
                ctx.fillStyle=og; ctx.globalAlpha=1;
                ctx.beginPath(); ctx.arc(0,0,this.radius*3.5,0,Math.PI*2); ctx.fill();
                // Swirling rays
                for(let i=0;i<10;i++){
                    const a=(i/10)*Math.PI*2+this.rotation*3;
                    ctx.save(); ctx.rotate(a); ctx.globalAlpha=0.3+0.2*Math.sin(frameCount*0.08+i);
                    ctx.strokeStyle=i%2===0?'#c77dff':'#7b2fbe'; ctx.lineWidth=1.5;
                    ctx.beginPath(); ctx.moveTo(this.radius*0.6,0);
                    ctx.quadraticCurveTo(this.radius*1.4,this.radius*0.9,this.radius*2.8,this.radius*0.2);
                    ctx.stroke(); ctx.restore();
                }
                // Black hole body
                ctx.globalAlpha=1;
                ctx.fillStyle='#05020a'; ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fill();
                // Glowing ring
                ctx.shadowBlur=14*pulse; ctx.shadowColor='#c77dff';
                ctx.strokeStyle='#c77dff'; ctx.lineWidth=2+pulse*2; ctx.globalAlpha=0.85;
                ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.stroke();
                if (this.hitFlashTimer>0) { ctx.globalAlpha=0.5; ctx.fillStyle=colors.danger; ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fill(); }
                ctx.restore();
                if (hp<1) {
                    ctx.save(); ctx.globalAlpha=Math.max(0.3,hp);
                    ctx.fillStyle=colors.muted; ctx.fillRect(this.x-16,this.y-26,32,3);
                    ctx.fillStyle='#c77dff'; ctx.fillRect(this.x-16,this.y-26,32*hp,3); ctx.restore();
                }
                return;
            }

            // ── PENUMBRA custom draw ──
            if (this.effect==='penumbra') {
                const r = this.radius;
                const pulse = 0.5 + 0.5 * Math.sin(frameCount * 0.09);

                // Outer glow halo
                const glow = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.5);
                glow.addColorStop(0,   `rgba(120, 0, 180, ${0.4 + 0.15 * pulse})`);
                glow.addColorStop(0.5, `rgba(80,  0, 130, ${0.25 + 0.1 * pulse})`);
                glow.addColorStop(1,   'rgba(20, 0, 50, 0)');
                ctx.globalAlpha = 1;
                ctx.fillStyle = glow;
                ctx.beginPath(); ctx.arc(0, 0, r * 2.5, 0, Math.PI * 2); ctx.fill();

                // Black body
                ctx.fillStyle = '#04010a';
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();

                // Bright purple corona ring stroke
                ctx.shadowBlur = 10 + 6 * pulse;
                ctx.shadowColor = '#b44fff';
                ctx.strokeStyle = `rgba(160, 40, 220, ${0.8 + 0.15 * pulse})`;
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
                ctx.shadowBlur = 0;

                // Hit flash
                if (this.hitFlashTimer > 0) {
                    ctx.globalAlpha = 0.5;
                    ctx.fillStyle = colors.danger;
                    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
                    ctx.globalAlpha = 1;
                }

                ctx.restore();
                if (hp < 1) {
                    ctx.save(); ctx.globalAlpha = Math.max(0.3, hp);
                    ctx.fillStyle = colors.muted;
                    ctx.fillRect(this.x - 12, this.y - 22, 24, 3);
                    ctx.fillStyle = '#b44fff';
                    ctx.fillRect(this.x - 12, this.y - 22, 24 * hp, 3);
                    ctx.restore();
                }
                return;
            }
            if (this.hitFlashTimer>0) { ctx.strokeStyle=colors.danger; ctx.fillStyle=colors.danger; ctx.lineWidth=4; ctx.globalAlpha=1; }
            else { ctx.globalAlpha=alpha; if (this.effect==='ghost') ctx.globalAlpha*=0.6; ctx.strokeStyle=this.slowTimer>0?'#4cc9f0':this.baseColor; ctx.lineWidth=3; }
            // Lumen aura
            if (this.effect==='lumen' && this.hitFlashTimer<=0) {
                ctx.save();
                const pulse=0.5+0.5*Math.sin(frameCount*0.12);
                ctx.strokeStyle='#FFE566'; ctx.lineWidth=2+pulse*2; ctx.globalAlpha=0.25+0.2*pulse;
                drawShape(ctx,0,0,this.radius*1.6,'star',true);
                ctx.strokeStyle='#fff8a0'; ctx.lineWidth=1; ctx.globalAlpha=0.15+0.1*pulse;
                drawShape(ctx,0,0,this.radius*2.1,'star',true);
                ctx.restore();
            }
            if (this.slowTimer>0 && this.hitFlashTimer<=0) {
                ctx.fillStyle='rgba(76,201,240,0.35)';
                drawShape(ctx,0,0,this.radius,this.shape,false);
            }
            drawShape(ctx,0,0,this.radius,this.shape,true);
            if (this.effect==='shield'&&this.hitFlashTimer<=0) {
                ctx.save(); ctx.strokeStyle='#4CC9F0'; ctx.lineWidth=1; ctx.globalAlpha=0.6*hp;
                ctx.beginPath(); ctx.arc(0,0,this.radius+5,0,Math.PI*2); ctx.stroke(); ctx.restore();
            }
            if (this.hitFlashTimer>0) { ctx.globalAlpha=0.9; ctx.fillStyle=colors.danger; }
            else { ctx.globalAlpha*=0.4; ctx.fillStyle=ctx.strokeStyle; }
            drawShape(ctx,0,0,this.radius*0.5,this.shape,false); ctx.restore();
            if (hp<1) {
                ctx.save(); ctx.globalAlpha=Math.max(0.3,hp);
                ctx.fillStyle=colors.muted; ctx.fillRect(this.x-12,this.y-20,24,3);
                ctx.fillStyle=this.hitFlashTimer>0?colors.danger:(this.effect==='shield'?'#4CC9F0':colors.accent);
                ctx.fillRect(this.x-12,this.y-20,24*hp,3); ctx.restore();
            }
        }
    }

    // ════════════════════════════════════════════════════════════════════
    //  TOWER  ← cosmetics integrated here
    // ════════════════════════════════════════════════════════════════════
    class Tower {
        constructor(x, y, type) {
            this.x=x; this.y=y; this.type=type;
            this.config=towerTypes[type];
            this.stats={...this.config};
            this.lvls={damage:1, speed:1, range:1};
            this.totalValue=this.config.cost;
            this.cooldown=0;
            this.blindTimer=0;
            this.rotation=Math.random()*Math.PI*2;
        }
        update() {
            this.rotation+=(this.config.effect==='void'||this.config.effect==='solar')?0.08:0.02;
            if (this.stats.effect==='income') return;
            if (this.blindTimer>0) { this.blindTimer--; return; }
            if (this.cooldown>0) { this.cooldown--; return; }
            const target=enemies.find(e=>!e.dead&&Math.sqrt((e.x-this.x)**2+(e.y-this.y)**2)<=this.stats.range);
            if (target) { projectiles.push(new Projectile(this.x,this.y,target,this.stats)); this.cooldown=this.stats.fireRate; }
        }
        draw() {
            const isSel=selectedTower===this;
            const totalLvl=this.lvls.damage+this.lvls.speed+this.lvls.range-2;

            // Range ring when selected
            if (isSel&&this.stats.range>0) {
                ctx.save();
                ctx.beginPath(); ctx.arc(this.x,this.y,this.stats.range,0,Math.PI*2);
                ctx.strokeStyle='rgba(242,233,228,0.2)'; ctx.lineWidth=1; ctx.setLineDash([5,5]); ctx.stroke();
                ctx.restore();
            }

            ctx.save(); ctx.translate(this.x, this.y);
            const size=(15*(1+totalLvl*0.1));

            // Void hex aura
            if (this.config.effect==='void') {
                ctx.save(); ctx.rotate(-this.rotation*0.5);
                ctx.strokeStyle='#9d4edd'; ctx.lineWidth=2; ctx.globalAlpha=0.4;
                drawShape(ctx,0,0,size*1.5,'hexagon',true); ctx.restore();
            }

            // Solar sun rendering — drawn entirely custom, skips generic body below
            if (this.config.effect==='solar') {
                const pulse=0.6+0.4*Math.sin(frameCount*0.08);
                const r=size;

                // Outer soft glow
                ctx.save();
                const outerGlow=ctx.createRadialGradient(0,0,r*0.5,0,0,r*2.8);
                outerGlow.addColorStop(0,'rgba(255,220,0,0.22)');
                outerGlow.addColorStop(0.5,'rgba(255,140,0,0.10)');
                outerGlow.addColorStop(1,'rgba(255,80,0,0)');
                ctx.fillStyle=outerGlow;
                ctx.beginPath(); ctx.arc(0,0,r*2.8,0,Math.PI*2); ctx.fill();
                ctx.restore();

                // Halftone dot ring
                ctx.save();
                const dotRings=[{dist:r*1.25,count:18,dotR:1.8},{dist:r*1.55,count:26,dotR:1.4},{dist:r*1.80,count:32,dotR:1.0}];
                dotRings.forEach(({dist,count,dotR})=>{
                    for(let i=0;i<count;i++){
                        const a=(i/count)*Math.PI*2+this.rotation*0.3;
                        const alpha=0.55+0.25*Math.sin(frameCount*0.06+i);
                        ctx.globalAlpha=alpha;
                        ctx.fillStyle=i%3===0?'#FF8C00':'#FFD700';
                        ctx.beginPath();
                        ctx.arc(Math.cos(a)*dist,Math.sin(a)*dist,dotR,0,Math.PI*2);
                        ctx.fill();
                    }
                });
                ctx.restore();

                // Sun body — radial gradient
                ctx.save();
                const grad=ctx.createRadialGradient(0,0,0,0,0,r);
                grad.addColorStop(0,'#FFFF88');
                grad.addColorStop(0.4,'#FFE000');
                grad.addColorStop(0.75,'#FFA500');
                grad.addColorStop(1,'#FF6A00');
                ctx.shadowBlur=18*pulse; ctx.shadowColor='#FFD700';
                ctx.fillStyle=grad;
                ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
                ctx.restore();

                // Bright core flare
                ctx.save();
                const core=ctx.createRadialGradient(0,0,0,0,0,r*0.5);
                core.addColorStop(0,`rgba(255,255,220,${0.7*pulse})`);
                core.addColorStop(1,'rgba(255,255,180,0)');
                ctx.fillStyle=core;
                ctx.beginPath(); ctx.arc(0,0,r*0.5,0,Math.PI*2); ctx.fill();
                ctx.restore();

                // Selection ring
                if (isSel) {
                    ctx.save();
                    ctx.strokeStyle='rgba(255,255,200,0.8)'; ctx.lineWidth=2; ctx.setLineDash([4,4]);
                    ctx.beginPath(); ctx.arc(0,0,r+6,0,Math.PI*2); ctx.stroke();
                    ctx.restore();
                }

                const skinIcon=getEquippedIconForType(this.type);
                if (skinIcon) {
                    ctx.save();
                    ctx.font=`${size*1.6}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
                    ctx.fillText(skinIcon,0,0); ctx.restore();
                }
                ctx.restore();
                return; // skip generic rendering below
            }

            // Orbit ring at lvl 3+
            if (totalLvl>=3) {
                ctx.save(); ctx.strokeStyle=colors.accent; ctx.lineWidth=1; ctx.globalAlpha=0.3;
                ctx.rotate(this.rotation);
                ctx.beginPath(); ctx.ellipse(0,0,size+10,(size+10)*0.4,0,0,Math.PI*2); ctx.stroke();
                if (totalLvl>=6) { ctx.rotate(Math.PI/2); ctx.beginPath(); ctx.ellipse(0,0,size+15,(size+15)*0.4,0,0,Math.PI*2); ctx.stroke(); }
                ctx.restore();
            }

            // Selection highlight
            if (isSel) {
                ctx.shadowBlur=10; ctx.shadowColor=colors.light;
                ctx.fillStyle=colors.light; drawShape(ctx,0,0,size+4,this.config.shape);
                ctx.shadowBlur=0;
                ctx.fillStyle=colors.dark; drawShape(ctx,0,0,size+2,this.config.shape);
            }

            // Main body
            ctx.fillStyle=this.config.effect==='void'?'#3c096c':colors.accent;
            drawShape(ctx,0,0,size,this.config.shape);

            // Core pulse
            const cp=(Math.sin(frameCount*0.1)*0.2)+0.8;
            ctx.fillStyle=this.config.effect==='void'?'#e0aaff':colors.light;
            ctx.globalAlpha=0.4*cp;
            drawShape(ctx,0,0,size*0.5,this.config.shape);
            ctx.globalAlpha=1;

            // ── COSMETIC SKIN ── rendered on top of the tower body
            const skinIcon = getEquippedIconForType(this.type);
            if (skinIcon) {
                // Scale emoji relative to tower size; add gentle per-tower wobble offset
                const emojiSize = size * 1.6;
                ctx.save();
                ctx.font = `${emojiSize}px serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Slow per-tower wobble using rotation offset as phase
                const wobble = Math.sin(frameCount * 0.04 + this.rotation) * 3;
                ctx.rotate(wobble * Math.PI / 180);
                ctx.fillText(skinIcon, 0, 0);
                ctx.restore();
            }

            // ── BLINDED indicator ──
            if (this.blindTimer>0) {
                ctx.save();
                ctx.globalAlpha=0.55+0.35*Math.sin(frameCount*0.4);
                ctx.fillStyle='#FFE566';
                ctx.shadowBlur=10; ctx.shadowColor='#FFE566';
                ctx.font=`${size*1.1}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
                ctx.fillText('🌟',0,0);
                ctx.restore();
            }

            ctx.restore();
        }
    }

    // ════════════════════════════════════════════════════════════════════
    //  PROJECTILE
    // ════════════════════════════════════════════════════════════════════
    class Projectile {
        constructor(x,y,target,stats) {
            this.x=x; this.y=y; this.target=target;
            this.speed=(stats.effect==='void'||stats.effect==='solar')?20:12;
            this.damage=stats.damage; this.effect=stats.effect;
            this.splashRadius=stats.splashRadius||0;
            this.slowDuration=stats.slowDuration||120;
            this.dead=false;
        }
        update() {
            const dx=this.target.x-this.x, dy=this.target.y-this.y, dist=Math.sqrt(dx*dx+dy*dy);
            if (dist<this.speed) {
                this.dead=true;
                if (this.effect==='splash') {
                    enemies.forEach(e=>{ if (!e.dead&&Math.sqrt((e.x-this.x)**2+(e.y-this.y)**2)<this.splashRadius) e.takeDamage(this.damage, this.effect); });
                    particles.push({x:this.x,y:this.y,life:15,color:colors.light,isRing:true,maxRadius:this.splashRadius});
                } else {
                    this.target.takeDamage(this.damage, this.effect);
                    if (this.effect==='freeze') this.target.slowTimer=this.slowDuration;
                }
                createExplosion(this.x,this.y,this.effect==='void'?'#e0aaff':(this.effect==='solar'?'#FFD700':colors.light));
            } else { this.x+=(dx/dist)*this.speed; this.y+=(dy/dist)*this.speed; }
        }
        draw() {
            ctx.save();
            ctx.fillStyle=this.effect==='void'?'#e0aaff':(this.effect==='solar'?'#FFD700':colors.light);
            ctx.shadowBlur=this.effect==='void'?8:(this.effect==='solar'?10:0);
            ctx.shadowColor=this.effect==='solar'?'#FFD700':'#e0aaff';
            ctx.beginPath(); ctx.arc(this.x,this.y,this.effect==='void'||this.effect==='solar'?3:4,0,Math.PI*2); ctx.fill();
            ctx.restore();
        }
    }

    function createExplosion(x,y,color,count=8) {
        for(let i=0;i<count;i++) particles.push({x,y,vx:(Math.random()-0.5)*8,vy:(Math.random()-0.5)*8,life:20,color});
    }

    function updateUI() {
        document.getElementById('gold-display').innerText  = `CREDITS: ${Math.floor(gold)}`;
        document.getElementById('health-display').innerText= `INTEGRITY: ${health}`;
        document.getElementById('wave-display').innerText  = `WAVE: ${wave}`;
        Object.keys(towerTypes).forEach(key=>{
            const btn=document.getElementById(`btn-${key}`);
            if (btn) btn.disabled=gold<towerTypes[key].cost;
        });
        const intel=document.getElementById('enemy-preview');
        const nw=wave+1;
        let txt=`Upcoming: Wave ${nw}<br>`;
        if (nw%60===0)      txt+="<span style='color:#ff9fff;font-weight:bold;text-shadow:0 0 8px #c77dff'>☉⚠ UMBRA + LUMEN — CRITICAL THREAT</span>";
        else if (nw%30===0) txt+="<span style='color:#c77dff;font-weight:bold;text-shadow:0 0 8px #9d4edd'>☉ UMBRA ENTITY — SOLAR ONLY</span>";
        else if (nw%20===0) txt+="<span style='color:#FFE566;font-weight:bold;text-shadow:0 0 6px #FFE566'>⚠ LUMEN ENTITY — VOID ONLY</span>";
        else if (nw%10===0) txt+="<span class='text-red-400 font-bold'>CENTRAL OVERRIDE</span>";
        else if (nw%5===0)  txt+="<span class='text-blue-400 font-bold'>AEGIS UNITS</span>";
        else                txt+="STANDARD SWARM";
        intel.innerHTML=txt;
        if (health<=0) document.getElementById('game-over').classList.remove('hidden');
        updateUpgradeUI();
    }

    function startWave() {
        if (isWaveActive) return;
        const btn = document.getElementById('start-btn');
        btn.disabled = true;
        launchWave();
    }

    function launchWave() {
        wave++; isWaveActive=true;
        towers.forEach(t=>{ if(t.stats.effect==='income') gold+=Math.floor(t.stats.damage); });
        updateUI();
        const list=[];
        const intensity=8+Math.floor(wave*1.5);
        if (wave%60===0)      { list.push('umbra'); list.push('lumen'); }
        else if (wave%30===0) { list.push('umbra'); }
        else if (wave%20===0) { list.push('lumen'); }
        for(let i=0;i<intensity;i++) {
            if (wave>=10&&i%10===0) list.push('boss');
            else if (wave>=5&&i%5===0) list.push('shield');
            else if (wave>=3&&i%4===0) list.push('tank');
            else list.push('basic');
        }
        // Spawn first enemy immediately so enemies.length is never 0 right after wave starts
        enemies.push(new Enemy(wave, list[0]));
        let spawned=1;
        const iv=setInterval(()=>{ if(spawned<list.length){enemies.push(new Enemy(wave,list[spawned]));spawned++;}else clearInterval(iv); },500);
    }

    async function fetchKnownWords() {
        const {data:{user}}=await supabaseClient.auth.getUser(); if(!user) return [];
        const {data}=await supabaseClient.from('profiles').select('known_words').eq('id',user.id).single();
        return (data?.known_words||[]).slice(-10);

    async function generateQuizFromCerebras(words) {
        try {
            const response = await fetch('/api/generate-quiz', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ words: words })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || `Server Error: ${response.status}`);
            }

            const quiz = await response.json();
            return quiz;
        } catch (error) {
            console.error("Failed to generate quiz:", error);
            throw error;
        }
    }

    async function restoreSession() {
        try {
            const r=await fetch('/api/session'); if(!r.ok) return;
            const {access_token,refresh_token}=await r.json();
            await supabaseClient.auth.setSession({access_token,refresh_token});
        } catch(e) { console.warn('session restore:',e); }

    function serialiseTowers() {
        return towers.map(t=>({x:t.x,y:t.y,type:t.type,lvls:{...t.lvls},totalValue:t.totalValue}));
    }

    function deserialiseTowers(snap) {
        towers=[];
        snap.forEach(s=>{
            const t=new Tower(s.x,s.y,s.type);
            t.lvls={...s.lvls}; t.totalValue=s.totalValue;
            const {lvls,config}=t;
            for(let i=1;i<lvls.damage;i++) config.effect==='income'?t.stats.damage+=5:(t.type==='freeze'?t.stats.slowDuration=(t.stats.slowDuration||120)+15:t.stats.damage*=1.8);
            for(let i=1;i<lvls.speed;i++)  config.effect==='splash'?t.stats.splashRadius*=1.4:t.stats.fireRate*=0.75;
            for(let i=1;i<lvls.range;i++)  t.stats.range*=1.25;
            towers.push(t);
        });
    }

    async function saveProgress() {
        const {data:{user}}=await supabaseClient.auth.getUser(); if(!user) return;
        const {error}=await supabaseClient.from('tower_progress').upsert(
            {user_id:user.id,wave,gold:Math.floor(gold),castle_hp:health,towers_built:towers.length,enemies_defeated:enemiesDefeatedTotal,towers_snapshot:serialiseTowers()},
            {onConflict:'user_id'}
        );
        if(error) console.error('saveProgress:',error.message);
    }

    async function loadProgress() {
        const {data:{user}}=await supabaseClient.auth.getUser(); if(!user) return;
        const {data,error}=await supabaseClient.from('tower_progress')
            .select('wave,gold,castle_hp,towers_built,enemies_defeated,towers_snapshot')
            .eq('user_id',user.id).single();
        if(error||!data) { console.log('No saved progress.'); return; }
        wave=data.wave??0; gold=data.gold??150; health=data.castle_hp??20;
        enemiesDefeatedTotal=data.enemies_defeated??0;
        if(data.towers_snapshot?.length) deserialiseTowers(data.towers_snapshot);
        updateUI();
    }

    // ════════════════════════════════════════════════════════════════════
    window.addEventListener('mousemove', e=>{
        const r=canvas.getBoundingClientRect();
        mouseX=e.clientX-r.left; mouseY=e.clientY-r.top;
    });

    window.addEventListener('mouseup', ()=>{
        if (draggingTowerType) {
            const cfg=towerTypes[draggingTowerType];
            if (mouseX>=0&&mouseX<=canvas.width&&mouseY>=0&&mouseY<=canvas.height) {
                const blocked=isOnPath(mouseX,mouseY)||towers.some(t=>Math.sqrt((t.x-mouseX)**2+(t.y-mouseY)**2)<40);
                if (!blocked&&gold>=cfg.cost) {
                    const nt=new Tower(mouseX,mouseY,draggingTowerType);
                    towers.push(nt); gold-=cfg.cost; updateUI(); selectTower(nt);
                }
            }
        }
        draggingTowerType=null;
    });

    canvas.addEventListener('mousedown', ()=>{
        const t=towers.find(t=>Math.sqrt((t.x-mouseX)**2+(t.y-mouseY)**2)<30);
        if(t) selectTower(t); else deselectTower();
    });

    // ════════════════════════════════════════════════════════════════════
    //  GAME LOOP
    // ════════════════════════════════════════════════════════════════════
    function gameLoop() {
        frameCount++;
        ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
        ctx.fillStyle='#1a1a2e'; ctx.fillRect(0,0,canvas.width,canvas.height);

        // Draw path
        ctx.save();
        ctx.strokeStyle=colors.muted; ctx.lineWidth=trackWidth; ctx.lineCap='round'; ctx.lineJoin='round';
        ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y); path.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
        ctx.strokeStyle='#1a1a2e'; ctx.lineWidth=trackWidth-10;
        ctx.beginPath(); ctx.moveTo(path[0].x,path[0].y); path.forEach(p=>ctx.lineTo(p.x,p.y)); ctx.stroke();
        ctx.restore();

        towers.forEach(t=>{ t.update(); t.draw(); });

        // Drag preview
        if (draggingTowerType) {
            const cfg=towerTypes[draggingTowerType];
            const blocked=isOnPath(mouseX,mouseY)||towers.some(t=>Math.sqrt((t.x-mouseX)**2+(t.y-mouseY)**2)<40);
            ctx.save();
            ctx.beginPath(); ctx.arc(mouseX,mouseY,cfg.range,0,Math.PI*2);
            ctx.strokeStyle=blocked?'rgba(255,85,85,0.3)':'rgba(242,233,228,0.2)';
            ctx.setLineDash([5,5]); ctx.stroke(); ctx.restore();
            ctx.save(); ctx.globalAlpha=0.5;
            ctx.fillStyle=blocked?'#ff5555':colors.light;
            drawShape(ctx,mouseX,mouseY,15,cfg.shape); ctx.restore();
        }

        enemies=enemies.filter(e=>{ if(e.dead||e.health<=0) return false; e.update(); e.draw(); return true; });
        projectiles=projectiles.filter(p=>{ if(p.dead||p.target.dead) return false; p.update(); p.draw(); return true; });

        particles=particles.filter(p=>{
            ctx.save();
            if(p.isRing) {
                ctx.strokeStyle=p.color; ctx.lineWidth=2; ctx.globalAlpha=Math.max(0,p.life/15);
                ctx.beginPath(); ctx.arc(p.x,p.y,p.maxRadius*(1-p.life/15),0,Math.PI*2); ctx.stroke();
            } else {
                p.x+=p.vx; p.y+=p.vy;
                ctx.fillStyle=p.color; ctx.globalAlpha=Math.max(0,p.life/20);
                ctx.fillRect(p.x,p.y,3,3);
            }
            ctx.restore(); p.life--; return p.life>0;
        });

        // Light rays (Lumen ability)
        lightRays=lightRays.filter(r=>{
            ctx.save();
            const t=r.life/r.maxLife;
            ctx.globalAlpha=t*0.85;
            ctx.strokeStyle='#FFE566'; ctx.lineWidth=2+t*3;
            ctx.shadowBlur=12; ctx.shadowColor='#FFE566';
            ctx.beginPath(); ctx.moveTo(r.x1,r.y1); ctx.lineTo(r.x2,r.y2); ctx.stroke();
            // Bright core line
            ctx.strokeStyle='#fff8a0'; ctx.lineWidth=1; ctx.shadowBlur=0;
            ctx.beginPath(); ctx.moveTo(r.x1,r.y1); ctx.lineTo(r.x2,r.y2); ctx.stroke();
            ctx.restore(); r.life--; return r.life>0;
        });

        if (isWaveActive&&enemies.length===0) {
            isWaveActive=false;
            saveProgress();
            if (wave > 0) triggerWaveEndQuiz();
            else document.getElementById('start-btn').disabled = false;
        }
        requestAnimationFrame(gameLoop);
    }

    // ════════════════════════════════════════════════════════════════════
    //  SHARED QUIZ RUNNER — used before wave AND after wave
    // ════════════════════════════════════════════════════════════════════
    async function runQuizThen(onComplete) {
        const total = 3;
        let current = 0;

        async function runNext() {
            if (current >= total) {
                closeQuiz();
                setTimeout(onComplete, 600);
                return;
            }
            current++;
            document.getElementById('quiz-overlay').classList.add('active');
            document.getElementById('quiz-loading').classList.remove('hidden');
            document.getElementById('quiz-actual').classList.add('hidden');
            try {
                await restoreSession();
                const words = await fetchKnownWords();
                if (!words.length) { gold += 100; updateUI(); setTimeout(runNext, 400); return; }
                const quiz = await generateQuizFromCerebras(words);
                document.querySelector('#quiz-actual h2').innerText = `Intel Injection (${current}/${total})`;
                document.getElementById('question-text').innerText = quiz.question;
                const oc = document.getElementById('options-container'); oc.innerHTML = '';
                quiz.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "py-3 px-4 border text-left text-xs font-bold transition-all uppercase answer";
                    btn.style.borderColor = colors.accent; btn.style.color = colors.light; btn.innerText = opt;
                    btn.onclick = () => {
                        oc.querySelectorAll('button').forEach(b => b.disabled = true);
                        if (idx === quiz.correctIndex) {
                            playSFX("correct")
                            btn.style.background = '#4CAF50'; btn.style.color = '#fff'; btn.style.borderColor = '#4CAF50';
                            gold += quiz.reward; updateUI();
                            setTimeout(runNext, 900);
                        } else {
                            playSFX("incorrect")
                            btn.style.background = '#C1121F'; btn.style.color = '#fff'; btn.style.borderColor = '#C1121F';
                            oc.querySelectorAll('button')[quiz.correctIndex].style.background = '#4CAF50';
                            oc.querySelectorAll('button')[quiz.correctIndex].style.color = '#fff';
                            oc.querySelectorAll('button')[quiz.correctIndex].style.borderColor = '#4CAF50';
                            
                            setTimeout(runNext, 1400);
                        }
                    };
                    oc.appendChild(btn);
                });
                document.getElementById('quiz-loading').classList.add('hidden');
                document.getElementById('quiz-actual').classList.remove('hidden');
            } catch(e) { console.error(e); gold += 100; updateUI(); setTimeout(runNext, 400); }
        }
        runNext();
    }

    function triggerWaveEndQuiz() {
        runQuizThen(() => {
            document.getElementById('start-btn').disabled = false;
        });
    }

    
    window.onload = async () => {
        initShop();
        updateUI();
        gameLoop();
        await restoreSession();
        // Load progress and cosmetics in parallel
        await Promise.all([loadProgress(), loadCosmeticSkins()]);
    };
    </script>
