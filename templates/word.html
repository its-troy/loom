<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loom - lesson</title>
    <link rel="icon" href="{{ url_for('static', filename='.module/favicon.ico') }}" type="image/x-icon">

    <!-- Word -->
    <link rel="stylesheet" href="{{ url_for('static', filename='word/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="{{ url_for('static', filename='word/script.js') }}" defer></script>

    <!-- Global -->
    <link rel="stylesheet" href="{{ url_for('static', filename='.module/global/style.css') }}">
    <script src="{{ url_for('static', filename='.module/global/script.js') }}"></script>

    <!-- Cursor -->
    <link rel="stylesheet" href="{{ url_for('static', filename='.module/cursor/style.css') }}">
    <script src="{{ url_for('static', filename='.module/cursor/script.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/1.20.3/TweenMax.min.js"></script>

    <!-- Caret -->
    <link rel="stylesheet" href="{{ url_for('static', filename='.module/caret/style.css') }}">
    <script src="{{ url_for('static', filename='.module/caret/script.js') }}"></script>
</head>

<body>
    <div class="cursor" hidden>
        <div class="cursor__ball cursor__ball--big ">
            <svg height="30" width="30">
                <circle cx="15" cy="15" r="12" stroke-width="0"></circle>
            </svg>
        </div>

        <div class="cursor__ball cursor__ball--small">
            <svg height="10" width="10">
                <circle cx="5" cy="5" r="4" stroke-width="0"></circle>
            </svg>
        </div>
    </div>

    <div class="main">
        <h1 id="word"></h1>
        <div class="info">
            <p id="word_form"></p>
            <p>•</p>
            <div class="phonetic hoverable">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-volume">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M15 8a5 5 0 0 1 0 8" />
                    <path d="M17.7 5a9 9 0 0 1 0 14" />
                    <path
                        d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5" />
                </svg>
                <p></p>
            </div>
            <p>•</p>
            <p id="vietnamese_translation"></p>
        </div>
        <hr>
        <p id="definition"></p>
        <q id="example"></q>
        <div class="synonym_container">
            <div class="synonym"></div>
            <div class="synonym"></div>
            <div class="synonym"></div>
        </div>
        <div id="main_button" class="button_container">
            <a class="back_button hoverable">back</a>
            <a class="gen_button button hoverable">generate again</a>
            <a class="next_button hoverable">next</a>
        </div>
    </div>

    <div class="quiz">
        <div class="quiz_info">
            <p>Questions <span>1</span> of 5</p>
            <h1></h1>
            <div id="quiz_button" class="button_container">
                <div class="progress_bar_container">
                    <div class="progress_bar"></div>
                </div>
                <a class="next_button hoverable">next</a>
            </div>
        </div>
        <div class="options_container">
            <a class="options hoverable">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                    class="icon icon-tabler icons-tabler-filled icon-tabler-circle-letter-a">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M12 2c5.523 0 10 4.477 10 10s-4.477 10 -10 10s-10 -4.477 -10 -10s4.477 -10 10 -10m0 5a3 3 0 0 0 -3 3v6a1 1 0 0 0 2 0v-2h2v2a1 1 0 0 0 .883 .993l.117 .007a1 1 0 0 0 1 -1v-6a3 3 0 0 0 -3 -3m0 2a1 1 0 0 1 1 1v2h-2v-2a1 1 0 0 1 .883 -.993z" />
                </svg>
                <span></span>
            </a>
            <a class="options hoverable">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                    class="icon icon-tabler icons-tabler-filled icon-tabler-circle-letter-b">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M12 2c5.523 0 10 4.477 10 10s-4.477 10 -10 10s-10 -4.477 -10 -10s4.477 -10 10 -10m0 5h-2a1 1 0 0 0 -1 1v8a1 1 0 0 0 1 1h2a3 3 0 0 0 3 -3l-.005 -.176a3 3 0 0 0 -.654 -1.7l-.106 -.124l.106 -.124a3 3 0 0 0 -2.341 -4.876m0 6a1 1 0 0 1 0 2h-1v-2zm0 -4a1 1 0 0 1 0 2h-1v-2z" />
                </svg>
                <span></span>
            </a>
            <a class="options hoverable">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                    class="icon icon-tabler icons-tabler-filled icon-tabler-circle-letter-c">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M12 2c5.523 0 10 4.477 10 10s-4.477 10 -10 10s-10 -4.477 -10 -10s4.477 -10 10 -10m0 5a3 3 0 0 0 -3 3v4a3 3 0 0 0 6 0a1 1 0 0 0 -1.993 -.117l-.007 .117a1 1 0 0 1 -2 0v-4a1 1 0 0 1 1.993 -.117l.007 .117a1 1 0 0 0 2 0a3 3 0 0 0 -3 -3" />
                </svg>
                <span></span>
            </a>
            <a class="options hoverable">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"
                    class="icon icon-tabler icons-tabler-filled icon-tabler-circle-letter-d">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M12 2c5.523 0 10 4.477 10 10s-4.477 10 -10 10s-10 -4.477 -10 -10s4.477 -10 10 -10m0 5h-2a1 1 0 0 0 -1 1v8a1 1 0 0 0 1 1h2a3 3 0 0 0 3 -3v-4a3 3 0 0 0 -3 -3m0 2a1 1 0 0 1 1 1v4a1 1 0 0 1 -1 1h-1v-6z" />
                </svg>
                <span></span>
            </a>
        </div>
    </div>

    <div class="sentence">
        <p>Try using
            <a class="hoverable it_button">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-volume">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M15 8a5 5 0 0 1 0 8" />
                    <path d="M17.7 5a9 9 0 0 1 0 14" />
                    <path
                        d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5" />
                </svg>
                it
            </a>
            in a sentence!
        </p>
        <div id="input_container">
            <input class="hoverable" id="input" type="text" maxlength="42"></input>
            <div id="caret"></div>
        </div>
        <q id="explanation" hidden></q>
        <div id="sentence_button">
            <a class="hoverable back_button">check</a>
            <a class="disabled hoverable next_button">next</a>
        </div>
    </div>

    <div class="loading_screen">
        <h1>today's lesson</h1>
        <p>generating...</p>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
            <radialGradient id="a12" cx=".66" fx=".66" cy=".3125" fy=".3125" gradientTransform="scale(1.5)">
                <stop offset="0" stop-color="#F2E9E4"></stop>
                <stop offset=".3" stop-color="#F2E9E4" stop-opacity=".9"></stop>
                <stop offset=".6" stop-color="#F2E9E4" stop-opacity=".6"></stop>
                <stop offset=".8" stop-color="#F2E9E4" stop-opacity=".3"></stop>
                <stop offset="1" stop-color="#F2E9E4" stop-opacity="0"></stop>
            </radialGradient>
            <circle transform-origin="center" fill="none" stroke="url(#a12)" stroke-width="30" stroke-linecap="round"
                stroke-dasharray="200 1000" stroke-dashoffset="0" cx="100" cy="100" r="70">
                <animateTransform type="rotate" attributeName="transform" calcMode="spline" dur="2" values="360;0"
                    keyTimes="0;1" keySplines="0 0 1 1" repeatCount="indefinite"></animateTransform>
            </circle>
            <circle transform-origin="center" fill="none" opacity=".2" stroke="#F2E9E4" stroke-width="30"
                stroke-linecap="round" cx="100" cy="100" r="70"></circle>
        </svg>
    </div>

    <div id="sfx-library" style="display: none;">
        <audio id="sfx-correct" src="{{ url_for('static', filename='.module/sfx/correct.mp3') }}"
            preload="auto"></audio>
        <audio id="sfx-incorrect" src="{{ url_for('static', filename='.module/sfx/incorrect.mp3') }}"
            preload="auto"></audio>
        <audio id="sfx-confetti" src="{{ url_for('static', filename='.module/sfx/confetti.mp3') }}"
            preload="auto"></audio>
        <!-- <audio id="sfx-try-again" src="{{ url_for('static', filename='.module/sfx/try_again.mp3') }}" preload="auto"></audio> -->
    </div>
</body>

</html>
